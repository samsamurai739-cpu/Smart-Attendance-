{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<a href="{{ url_for('teacher_dashboard') if current_user.role == 'teacher' else url_for('student_dashboard') }}"
   class="btn btn-sm btn-link ps-0">&larr; Back to my dashboard</a>

<div class="row justify-content-center mt-2">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body p-4">
                <h5 class="mb-3">Change My Password</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" name="current_password" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" required minlength="4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>
                <p class="text-muted small mt-3">
                    Your username stays the same — only your password changes.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
